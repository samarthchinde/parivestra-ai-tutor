services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: parivestra-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Connect to host machine's local Unsloth / llama.cpp / Ollama server
      - LLM_BASE_URL=http://host.docker.internal:8000/v1
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - parivestra_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: parivestra-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  parivestra_data:

